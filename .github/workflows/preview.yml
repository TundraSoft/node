name: Branch preview

# Manual GHCR-only branch image. The build workflow no longer pushes branch/PR
# images, so run this when you need a pullable one for testing.

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version (e.g. 24.19.0)'
        required: true
      alpine-version:
        description: 'tundrasoft/alpine tag to build on (e.g. latest, 3.24, edge)'
        required: true
        default: latest
      platforms:
        description: 'Target platforms'
        required: true
        default: linux/amd64

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve tag
        id: vars
        run: |
          TAG=$(echo "ghcr.io/${{ github.repository }}:$(echo '${{ github.ref_name }}' | tr '/' '-')-${{ inputs.node-version }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.vars.outputs.tag }}
          build-args: |
            ALPINE_VERSION=${{ inputs.alpine-version }}
            NODE_VERSION=${{ inputs.node-version }}

      - name: Summary
        run: echo "Pushed preview image \`${{ steps.vars.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
